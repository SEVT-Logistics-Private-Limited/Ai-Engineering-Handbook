<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
<title id="title">From real-world data to an AI result</title>
<desc id="desc">A six-stage flow: source information, capture, encoding, storage or transport, decoding and preprocessing, model or software processing, and output.</desc>
<rect width="1400" height="430" rx="26" fill="#f8fafc"/>
<text x="54" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">From real-world data to an AI result</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g>
    <rect x="48" y="145" width="180" height="150" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="138" y="195" font-size="22" font-weight="700" fill="#075985">1. SOURCE</text>
    <text x="138" y="234" font-size="17" fill="#334155">Text, image,</text><text x="138" y="260" font-size="17" fill="#334155">sound or video</text>
  </g>
  <path d="M234 220h36m-11-10 11 10-11 10" stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="278" y="145" width="180" height="150" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text x="368" y="195" font-size="22" font-weight="700" fill="#1d4ed8">2. CAPTURE</text>
    <text x="368" y="234" font-size="17" fill="#334155">Camera, mic,</text><text x="368" y="260" font-size="17" fill="#334155">keyboard or app</text>
  </g>
  <path d="M464 220h36m-11-10 11 10-11 10" stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="508" y="145" width="180" height="150" rx="18" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <text x="598" y="195" font-size="22" font-weight="700" fill="#6d28d9">3. ENCODE</text>
    <text x="598" y="234" font-size="17" fill="#334155">Represent in a</text><text x="598" y="260" font-size="17" fill="#334155">digital format</text>
  </g>
  <path d="M694 220h36m-11-10 11 10-11 10" stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="738" y="145" width="180" height="150" rx="18" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
    <text x="828" y="195" font-size="22" font-weight="700" fill="#92400e">4. STORE</text>
    <text x="828" y="234" font-size="17" fill="#334155">Save or transmit</text><text x="828" y="260" font-size="17" fill="#334155">digital data</text>
  </g>
  <path d="M924 220h36m-11-10 11 10-11 10" stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="968" y="145" width="180" height="150" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <text x="1058" y="195" font-size="22" font-weight="700" fill="#166534">5. PREPARE</text>
    <text x="1058" y="234" font-size="17" fill="#334155">Decode, validate</text><text x="1058" y="260" font-size="17" fill="#334155">and preprocess</text>
  </g>
  <path d="M1154 220h36m-11-10 11 10-11 10" stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="1198" y="145" width="154" height="150" rx="18" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
    <text x="1275" y="195" font-size="22" font-weight="700" fill="#991b1b">6. PROCESS</text>
    <text x="1275" y="234" font-size="17" fill="#334155">Model /</text><text x="1275" y="260" font-size="17" fill="#334155">software output</text>
  </g>
</g>
<text x="54" y="355" font-family="Arial,sans-serif" font-size="18" fill="#475569">The stages are conceptual. Real systems may stream, skip, combine or repeat stages depending on the modality.</text>
</svg>